<!doctype html>
<!-- Source for assets/og-image.png (1200x630 link-preview card).
     Regenerate: serve the site, open this file in a browser at exactly
     1200x630, screenshot the viewport, save as assets/og-image.png. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0a0d12;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e7e9ea;
    position: relative;
  }
  .glow {
    position: absolute; right: -180px; top: -220px;
    width: 800px; height: 800px; border-radius: 50%;
    background: radial-gradient(circle, rgba(29,155,240,0.18) 0%, rgba(29,155,240,0) 65%);
  }
  .mark {
    position: absolute; right: 40px; bottom: -100px;
    font-family: Georgia, serif; font-size: 420px; font-weight: 700;
    color: #e7e9ea; opacity: 0.04; line-height: 1;
  }
  .inner {
    position: relative;
    padding: 90px 100px;
    display: flex; flex-direction: column; height: 100%;
  }
  .avatar {
    width: 130px; height: 130px; border-radius: 50%;
    border: 4px solid #1d9bf0;
    background: linear-gradient(135deg, #182430, #0e1620);
    display: flex; align-items: center; justify-content: center;
    font-size: 52px; font-weight: 800; letter-spacing: -2px;
    margin-bottom: 44px;
  }
  h1 { font-size: 68px; font-weight: 800; letter-spacing: -1px; }
  .sub { font-size: 34px; color: #8b939e; margin-top: 14px; }
  .tags { margin-top: 36px; font-size: 26px; color: #1d9bf0; font-weight: 600; }
  .tags span { margin-right: 26px; }
  .handle {
    margin-top: auto;
    font-size: 26px; color: #8b939e;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="mark">&#167;</div>
  <div class="inner">
    <div class="avatar">HR</div>
    <h1>Harrison Rogers</h1>
    <p class="sub">IP, privacy &amp; AI law &#215; software engineering</p>
    <p class="tags"><span>#Patents</span><span>#Licensing</span><span>#PrivacyLaw</span><span>#AIGovernance</span></p>
    <p class="handle">@hrrogers &#183; Indianapolis, IN</p>
  </div>
</body>
</html>
